<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarGlobal and Wasalt assistant</title>
<style>
  :root {
    --bg: #eef1ee; --panel: #ffffff; --ink: #15211e; --muted: #5b6b66;
    --pine: #0f4c43; --pine-ink: #e8f2ef; --line: #d5dcd8; --link: #1b6b78;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { background: var(--pine); color: var(--pine-ink); padding: 18px 24px; }
  header h1 { margin: 0; font: 600 1.35rem/1.2 Georgia, "Times New Roman", serif; letter-spacing: .01em; }
  header p { margin: 4px 0 0; font-size: .9rem; opacity: .85; max-width: 62ch; }
  main { flex: 1; display: grid; grid-template-columns: 280px 1fr; gap: 20px; padding: 20px 24px; min-height: 0; max-width: 1100px; width: 100%; margin: 0 auto; }
  aside h2 { font: 600 1rem Georgia, serif; margin: 0 0 8px; }
  aside button { display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); font: inherit; font-size: .92rem; cursor: pointer; }
  aside button:hover { border-color: var(--pine); }
  aside small { display: block; color: var(--muted); margin-top: 12px; line-height: 1.4; }
  .chat { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--pine); color: var(--pine-ink); }
  .bot { align-self: flex-start; background: #f2f5f3; border: 1px solid var(--line); }
  .bot ul { margin: 6px 0; padding-left: 20px; }
  .src { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); white-space: normal; }
  .src a { color: var(--link); }
  .src div { margin: 2px 0; }
  .note { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input { flex: 1; padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  form button { padding: 0 20px; background: var(--pine); color: var(--pine-ink); border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: wait; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 12px; } aside { display: none; } header { padding: 14px 16px; } .msg { max-width: 94%; } }
</style>
</head>
<body>
<header>
  <h1>DarGlobal and Wasalt assistant</h1>
  <p>Ask about DarGlobal's branded residences and projects, or Wasalt's Saudi property listings and prices.</p>
</header>
<main>
  <aside>
    <h2>Try asking</h2>
    <button>What is Trump Tower Jeddah?</button>
    <button>Which DarGlobal projects are in Saudi Arabia?</button>
    <button>Show villas in Riyadh under 2 million SAR</button>
    <button>What is the cheapest property on Wasalt?</button>
    <button>How are DarGlobal and Wasalt related?</button>
    <small>Answers come from pages collected from darglobal.co.uk and wasalt.sa. Prices and availability may have changed since collection.</small>
  </aside>
  <section class="chat">
    <div id="log" aria-live="polite"></div>
    <form id="f">
      <input id="q" placeholder="Ask a question" autocomplete="off" maxlength="1000" aria-label="Your question">
      <button id="send">Send</button>
    </form>
  </section>
</main>
<script>
const log = document.getElementById("log"), form = document.getElementById("f"),
      input = document.getElementById("q"), send = document.getElementById("send");
const history = [];

function esc(s) { return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function render(text) {
  let h = esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(?:^|\n)((?:[-*•] .+(?:\n|$))+)/g, (_, block) =>
    "<ul>" + block.trim().split("\n").map(l => "<li>" + l.replace(/^[-*•] /, "") + "</li>").join("") + "</ul>");
  return h;
}
function add(role, html, extra) {
  const d = document.createElement("div");
  d.className = "msg " + role; d.innerHTML = html;
  if (extra) d.appendChild(extra);
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function sources(list) {
  if (!list || !list.length) return null;
  const s = document.createElement("div"); s.className = "src";
  s.innerHTML = "Sources" + list.map(x => `<div>[${x.n}] <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div>`).join("");
  return s;
}
async function ask(text) {
  if (!text.trim()) return;
  add("user", esc(text)); input.value = ""; send.disabled = true;
  const wait = add("bot", "Searching the data…");
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: history.slice(-6) }) });
    const j = await r.json();
    wait.remove();
    if (!r.ok) { add("bot", esc(j.detail || "Something went wrong. Please try again.")); }
    else {
      const extra = sources(j.sources);
      const m = add("bot", render(j.answer), extra);
      if (j.model) { const n = document.createElement("div"); n.className = "note"; n.textContent = "Model: " + j.model; m.appendChild(n); }
      history.push({ role: "user", content: text }, { role: "assistant", content: j.answer.slice(0, 1500) });
    }
  } catch (e) { wait.remove(); add("bot", "Could not reach the server. Check your connection and try again."); }
  send.disabled = false; input.focus();
}
form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
document.querySelectorAll("aside button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));
add("bot", "Hello. I can answer questions about DarGlobal's projects and Wasalt's property listings. What would you like to know?");
</script>
</body>
</html>
